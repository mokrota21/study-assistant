[project]
name = "learning-harness"
version = "0.1.0"
description = "MCP server for the Learning Harness: scheduler, FSRS queue, block clock, mastery gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fsrs>=5.0.0",
]

[project.scripts]
learning-harness = "harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.uv]
package = true
